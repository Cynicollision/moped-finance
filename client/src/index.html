<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Moped Finance</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="favicon.ico" sizes="48x48" />
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <!-- Installing as an app (APP-9.1) -->
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="apple-mobile-web-app-title" content="Moped Finance" />
        <!-- The window's title bar follows the theme: ThemeService and theme.js choose which of these applies -->
        <meta name="theme-color" content="#121316" media="all" data-scheme="dark" />
        <meta name="theme-color" content="#faf9fd" media="not all" data-scheme="light" />
        <!-- Before the stylesheet loads, so the first paint is in the saved theme (SET-3.1) -->
        <script src="theme.js"></script>
    </head>
    <body>
        <app-root></app-root>
    </body>
</html>
