<mat-card appearance="outlined">
    <mat-card-header><mat-card-title>Finance</mat-card-title></mat-card-header>
    <mat-card-content>
        <nav mat-tab-nav-bar [tabPanel]="tabPanel" animationDuration="0ms">
            <a mat-tab-link *ngFor="let link of navLinks" [routerLink]="link.path" routerLinkActive
                #rla="routerLinkActive" [active]="rla.isActive">
                {{link.label}}
            </a>
        </nav>
        <mat-tab-nav-panel #tabPanel>
            <router-outlet></router-outlet>
        </mat-tab-nav-panel>
    </mat-card-content>
</mat-card>
