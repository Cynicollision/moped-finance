<h2 mat-dialog-title>Edit Account</h2>

<mat-dialog-content>
  <form [formGroup]="accountForm" class="account-form">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" placeholder="Account Name">
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let cat of categories" [value]="cat">{{cat}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Group</mat-label>
        <mat-select formControlName="group">
          <mat-option *ngFor="let grp of groups" [value]="grp">{{grp}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option *ngFor="let typ of types" [value]="typ">{{typ}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="toggles-grid">
      <mat-checkbox formControlName="isHidden">Hide Account</mat-checkbox>
      <mat-checkbox formControlName="isManual">Manual Account</mat-checkbox>
      <mat-checkbox formControlName="isRetirement">Retirement Account</mat-checkbox>
      <mat-checkbox formControlName="hideFromCashflow">Hide from Cashflow</mat-checkbox>
    </div>

    <mat-form-field appearance="outline" class="full-width" *ngIf="accountForm.get('isManual')?.value">
      <mat-label>Balance</mat-label>
      <input matInput formControlName="balance" type="number" step="0.01">
      <mat-error *ngIf="accountForm.get('balance')?.hasError('pattern')">
        Invalid decimal format
      </mat-error>
    </mat-form-field>
    
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-raised-button color="warn" class="delete-btn" (click)="onDelete()">Delete</button>
  <span class="spacer"></span>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!accountForm.valid">Save</button>
</mat-dialog-actions>
