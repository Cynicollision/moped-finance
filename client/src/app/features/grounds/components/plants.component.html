<div class="plants-container">

    <!-- Controls -->
    <div class="controls-container">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Search Plants</mat-label>
            <input matInput type="text" [(ngModel)]="searchText" (ngModelChange)="onSearchChange()"
                placeholder="Name or variety">
            <mat-icon matSuffix *ngIf="searchText" (click)="searchText=''; onSearchChange()"
                style="cursor: pointer;">close</mat-icon>
            <mat-icon matSuffix *ngIf="!searchText">search</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic">
            <mat-label>Category</mat-label>
            <mat-select [(ngModel)]="selectedCategory" (selectionChange)="onCategoryChange()">
                <mat-option *ngFor="let cat of categories" [value]="cat">{{cat}}</mat-option>
            </mat-select>
        </mat-form-field>
    </div>

    <!-- Cards Layout -->
    <div class="cards-grid">
        <mat-card appearance="outlined" class="plant-card" *ngFor="let card of filteredCards"
            (click)="onCardClick(card.id)">

            <!-- Image Placeholder -->
            <div class="plant-image-placeholder">
                <mat-icon class="placeholder-icon">local_florist</mat-icon>
            </div>

            <mat-card-content class="plant-card-content">
                <div class="plant-header">
                    <h3 class="plant-name">{{ card.commonName }}</h3>
                    <div class="plant-variety-name" *ngIf="card.varietyName">{{ card.varietyName }}</div>
                </div>

                <div class="plant-details">
                    <div class="detail-row">
                        <mat-icon class="detail-icon">category</mat-icon>
                        <span class="detail-text">{{ card.category }}</span>
                    </div>
                    <div class="detail-row">
                        <mat-icon class="detail-icon">place</mat-icon>
                        <span class="detail-text" *ngIf="card.locations.length > 0; else noLocations">
                            {{ card.locations.join(', ') }}
                        </span>
                        <ng-template #noLocations>
                            <span class="detail-text italic-muted">No locations assigned</span>
                        </ng-template>
                    </div>
                </div>
            </mat-card-content>
        </mat-card>

        <div *ngIf="filteredCards.length === 0" class="no-data-message">
            No plants found matching the selected criteria.
        </div>
    </div>
</div>
