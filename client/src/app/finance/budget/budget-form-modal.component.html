<app-modal-layout [title]="isEditing ? 'Edit ' + typeString : 'Add ' + typeString">
    <form id="budget-form" [formGroup]="budgetForm" (ngSubmit)="save()">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" [placeholder]="namePlaceholder" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Category</mat-label>
                <input type="text" matInput formControlName="categoryId" [matAutocomplete]="autoCategory" />
                <mat-autocomplete #autoCategory="matAutocomplete" [displayWith]="displayCategory">
                    @for (cat of filteredCategories(); track cat.id) {
                        <mat-option [value]="cat.id"> {{ cat.icon }} {{ cat.name }} </mat-option>
                    }
                </mat-autocomplete>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Amount</mat-label>
                <span matTextPrefix>$&nbsp;</span>
                <input matInput type="number" inputmode="decimal" min="0" formControlName="amount" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Recurrence</mat-label>
                <mat-select formControlName="recurrence">
                    @for (opt of recurrenceOptions; track opt) {
                        <mat-option [value]="opt">
                            {{ opt }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </form>

    @if (isEditing) {
        <div modal-actions-start>
            <button mat-button class="danger-button" type="button" (click)="delete()">Delete</button>
        </div>
    }
    <div modal-actions>
        <button mat-button type="button" appModalCancel>Cancel</button>
        <button mat-flat-button type="submit" form="budget-form" [disabled]="budgetForm.invalid || isSaving()">
            @if (isSaving()) {
                <mat-progress-spinner class="button-spinner" mode="indeterminate" diameter="18"></mat-progress-spinner>
            }
            Save
        </button>
    </div>
</app-modal-layout>
