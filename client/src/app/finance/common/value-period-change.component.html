<div class="change-indicator" [class.good]="change().isGood" [class.bad]="!change().isGood">
    @if (change().isPositive) {
        <mat-icon inline="true">arrow_upward</mat-icon>
    }
    @else {
        <mat-icon inline="true">arrow_downward</mat-icon>
    }
    <span class="change-amount">
        {{ change().amount | currency }} ({{ change().percentage | number:'1.1-2' }}%)
    </span>
    @if (label()) {
        <span class="change-label">
            - {{ label() }}
        </span>
    }
</div>
