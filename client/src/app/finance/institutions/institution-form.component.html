<form [formGroup]="institutionForm" (ngSubmit)="onSave()" class="details-form">
    <!-- Name -->
    @if (mode() === 'readonly') {
        <div class="readonly-field">
            <div class="label">Name</div>
            <div class="value">{{institutionForm.value.name}}</div>
        </div>
    }
    @else {
        <mat-form-field appearance="outline">
            <mat-label>Name</mat-label>
            <input type="text" matInput formControlName="name">
        </mat-form-field>
    }

    <!-- Form Actions -->
    @if (mode() !== 'readonly') {
        <div class="actions">
            <div class="right-actions">
                <button mat-button type="button" (click)="onCancel()">Cancel</button>
                <button mat-raised-button color="primary" type="submit" [disabled]="institutionForm.invalid">Save</button>
            </div>
        </div>
    }
</form>
