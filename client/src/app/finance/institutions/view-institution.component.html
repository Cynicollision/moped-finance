<div class="container" *ngIf="institution()">
    <div class="page-header">
        <div class="breadcrumb-nav">
            <a [routerLink]="['/institutions']" class="breadcrumb-link">Institutions</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">{{institution()!.name}}</span>
        </div>
        <div class="top-actions">
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More options">
                <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="onEdit()">
                    <mat-icon>edit</mat-icon>
                    <span>Edit</span>
                </button>
                <button mat-menu-item (click)="deleteInstitution()">
                    <mat-icon color="warn">delete</mat-icon>
                    <span style="color: var(--color-warn)">Delete</span>
                </button>
            </mat-menu>
        </div>
    </div>

    <app-institution-form 
        [institution]="institution()"
        mode="readonly">
    </app-institution-form>
</div>
