@if (transaction(); as transaction) {
    <div class="container">
        <div class="breadcrumb-nav">
            <a [routerLink]="['/transactions']" class="breadcrumb-link">Transactions</a>
            <span class="breadcrumb-separator">/</span>
            <a [routerLink]="['/transactions', transaction.id]" class="breadcrumb-link">Transaction Details</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Edit Transaction</span>
        </div>
        <div class="header-section">
            <h1 class="desktop-page-title">Edit Transaction</h1>
        </div>
        <app-transaction-form
            [transaction]="transaction"
            mode="edit"
            (save)="onSave($event)"
            (cancelled)="onCancel()">
        </app-transaction-form>
    </div>
}
