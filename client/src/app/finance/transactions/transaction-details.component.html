<div class="container" *ngIf="transaction()">
    <div class="breadcrumb-nav">
        <a [routerLink]="['/transactions']" class="breadcrumb-link">Transactions</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Transaction Details</span>
    </div>

    <form [formGroup]="transactionForm" (ngSubmit)="save()" class="details-form">
        <!-- Read-only values -->
        <div class="readonly-field amount transactions-table">
            <div class="label">Amount</div>
            <div class="value" [ngClass]="{'amount-positive': transaction()!.amount > 0, 'amount-negative': transaction()!.amount < 0}">
                {{Math.abs(transaction()!.amount) | currency}}
            </div>
        </div>

        <div class="readonly-field">
            <div class="label">Account</div>
            <div class="value">{{accountName()}}</div>
        </div>

        <div class="readonly-field">
            <div class="label">Merchant</div>
            <div class="value">{{transaction()!.merchant}}</div>
        </div>

        <div class="readonly-field">
            <div class="label">Original Statement</div>
            <div class="value">{{transaction()!.originalStatement}}</div>
        </div>

        <!-- Category (type ahead select - like transactions filter) -->
        <mat-form-field appearance="outline">
            <mat-label>Category</mat-label>
            <input type="text" matInput formControlName="category" [matAutocomplete]="autoCategory">
            <mat-autocomplete #autoCategory="matAutocomplete" [displayWith]="displayCategory">
                <mat-option *ngFor="let c of categories()" [value]="c.id">
                    {{c.icon}} {{c.name}}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>

        <!-- Date (editable date) -->
        <mat-form-field appearance="outline">
            <mat-label>Date</mat-label>
            <input matInput [matDatepicker]="datePicker" formControlName="date">
            <mat-datepicker-toggle matIconSuffix [for]="datePicker"></mat-datepicker-toggle>
            <mat-datepicker #datePicker></mat-datepicker>
        </mat-form-field>

        <!-- Notes (editable text area) -->
        <mat-form-field appearance="outline">
            <mat-label>Notes</mat-label>
            <textarea matInput formControlName="notes" rows="3"></textarea>
        </mat-form-field>

        <!-- Hide (editable checkbox) -->
        <div class="checkbox-container">
            <mat-checkbox formControlName="isHidden">Hide Transaction</mat-checkbox>
        </div>

        <div class="actions">
            <div>
                <button mat-raised-button color="warn" type="button" (click)="deleteTransaction()"
                    *ngIf="transactionId">Delete</button>
            </div>
            <div class="right-actions">
                <button mat-button type="button" (click)="cancel()">Cancel</button>
                <button mat-raised-button color="primary" type="submit"
                    [disabled]="transactionForm.invalid">Save</button>
            </div>
        </div>
    </form>
</div>
