<div class="container">
    <app-page-header title="Transaction Details" [crumbs]="[{ label: 'Transactions', link: '/transactions' }]">
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More options">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="onEdit()">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
            </button>
            @if (transaction()) {
                <button mat-menu-item (click)="split()">
                    <mat-icon>call_split</mat-icon>
                    <span>{{ isSplit() ? 'Edit split' : 'Split' }}</span>
                </button>
            }
            @if (isSplit()) {
                <button mat-menu-item (click)="unsplit()">
                    <mat-icon>merge</mat-icon>
                    <span>Unsplit</span>
                </button>
            }
            <button mat-menu-item class="danger-item" (click)="deleteTransaction()">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
            </button>
        </mat-menu>
    </app-page-header>
    @if (data.error(); as error) {
        <app-load-error [message]="error" (retry)="data.reload()"></app-load-error>
    } @else if (transaction(); as transaction) {
        <app-transaction-form [transaction]="transaction" [splitParts]="splitParts()" mode="readonly">
        </app-transaction-form>
    } @else {
        <app-card-skeleton [rows]="5"></app-card-skeleton>
    }
</div>
