<div class="summary-container details-container">
    @if (accountData(); as account) {
        <div class="breadcrumb-nav">
            <a [routerLink]="['/']" class="breadcrumb-link">Accounts</a>
            <span class="breadcrumb-separator">/</span>
            <a [routerLink]="['/accounts', account.id]" class="breadcrumb-link">{{ account.name }}</a>
            <span class="breadcrumb-separator">/</span>
            <span class="breadcrumb-current">Edit Account</span>
        </div>

        <div class="header-section">
            <h1 class="desktop-page-title">Edit Account</h1>
        </div>

        <app-account-form mode="edit" [account]="account" (save)="onSave($event)" (cancelled)="onCancel()">
        </app-account-form>

        <div class="danger-zone">
            <h3>
                <mat-icon>warning</mat-icon>
                Danger Zone
            </h3>
            <p>Once you delete an account, there is no going back. Please be certain.</p>
            <button mat-stroked-button color="warn" type="button" (click)="onDelete()">
                Delete Account
            </button>
        </div>
    }
    @else {
        <p>Loading account details...</p>
    }
</div>
