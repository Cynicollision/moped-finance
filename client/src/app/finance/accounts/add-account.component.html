<div class="add-container">
    <app-page-header title="Add Account" [crumbs]="[{ label: 'Settings', link: '/settings' }, { label: 'Institutions', link: '/settings/institutions' }]"></app-page-header>

    @if (institutions(); as institutions) {
        @if (institutions.length > 0) {
            <app-account-form mode="create" [institutions]="institutions" [defaultInstitutionId]="institutionId"
                (save)="onSave($event)" (cancelled)="onCancel()">
            </app-account-form>
        }
        @else {
            <div class="no-institutions">
                <p>Accounts belong to an institution, such as a bank or lender. Add one first.</p>
                <a mat-flat-button routerLink="/settings/institutions/new">Add institution</a>
            </div>
        }
    }
</div>
