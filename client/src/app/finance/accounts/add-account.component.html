<div class="add-container">
    <app-page-header
        title="Add Account"
        [crumbs]="[
            { label: 'Settings', link: '/settings' },
            { label: 'Institutions', link: '/settings/institutions' }
        ]"
    ></app-page-header>

    @if (institutions.error(); as error) {
        <app-load-error [message]="error" (retry)="institutions.reload()"></app-load-error>
    } @else if (institutions.value(); as institutions) {
        @if (institutions.length > 0) {
            <app-account-form
                mode="create"
                [institutions]="institutions"
                [defaultInstitutionId]="institutionId"
                [saving]="saving()"
                (save)="onSave($event)"
                (cancelled)="onCancel()"
            >
            </app-account-form>
        } @else {
            <div class="no-institutions">
                <p>Accounts belong to an institution, such as a bank or lender. Add one first.</p>
                <button mat-flat-button type="button" (click)="addInstitution()">Add institution</button>
            </div>
        }
    } @else {
        <app-card-skeleton [rows]="4"></app-card-skeleton>
    }
</div>
