<div class="add-container">
    <div class="breadcrumb-nav">
        <a [routerLink]="['/institutions']" class="breadcrumb-link">Institutions</a>
        <span class="breadcrumb-separator">/</span>
        <span class="breadcrumb-current">Add Account</span>
    </div>

    <div class="header-section">
        <h1 class="desktop-page-title">Add Account {{ institution() ? 'to ' + institution()!.name : '' }}</h1>
    </div>

    @if (mode() === 'selection') {
        <div class="selection-mode">
            <p class="description">How would you like to add this account?</p>
            <div class="options-container">
                <button mat-stroked-button class="option-btn" disabled>
                    <mat-icon>link</mat-icon>
                    <span>Connect via {{ institution()?.name }} (Coming Soon)</span>
                </button>
                <button mat-stroked-button color="primary" class="option-btn" (click)="mode.set('manual')">
                    <mat-icon>edit</mat-icon>
                    <span>Add manually</span>
                </button>
            </div>
        </div>
    }
    @else {
        <app-account-form mode="create" (save)="onSave($event)" (cancelled)="mode.set('selection')">
        </app-account-form>
    }
</div>
