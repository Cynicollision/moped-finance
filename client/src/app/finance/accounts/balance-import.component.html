<div class="import-container details-container">
    <app-page-header
        title="Import Balance History"
        [crumbs]="[
            { label: 'Dashboard', link: '/dashboard' },
            { label: account()?.name ?? 'Account', link: ['/accounts', accountId()] }
        ]"
    >
    </app-page-header>

    <mat-card appearance="outlined" class="import-card">
        <mat-card-content>
            <app-csv-import
                #importer
                subject="your balance history"
                columns="Date, AccountName, Balance"
                [run]="runImport"
                [replaces]="true"
                (imported)="onImported($event)"
            >
                @if (importer.dryRun(); as results) {
                    <p>
                        This import will replace all existing balance history for this account between
                        <strong>{{ results.startDate }}</strong> and <strong>{{ results.endDate }}</strong
                        >.
                    </p>
                    <ul>
                        <li>Days of history to import: {{ results.createdCount }}</li>
                        <li>Rows with errors: {{ results.failedRowMessages.length }}</li>
                    </ul>
                }
            </app-csv-import>
        </mat-card-content>
    </mat-card>
</div>
