<app-modal-layout [title]="isEditing ? 'Edit Category' : 'Create Category'">
    <form id="category-form" [formGroup]="form" (ngSubmit)="save()">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="e.g. Fuel">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Icon (Emoji)</mat-label>
                <input matInput formControlName="icon" placeholder="⛽">
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Group</mat-label>
                <mat-select formControlName="groupId">
                    @for (group of data.groups; track group.id) {
                        <mat-option [value]="group.id">
                            {{group.name}} ({{group.type}})
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <mat-checkbox formControlName="isActive">Active</mat-checkbox>
        </div>
    </form>

    <div modal-actions>
        <button mat-button type="button" appModalCancel>Cancel</button>
        <button mat-flat-button type="submit" form="category-form" [disabled]="form.invalid || isSaving()">
            @if (isSaving()) {
                <mat-progress-spinner class="button-spinner" mode="indeterminate" diameter="18"></mat-progress-spinner>
            }
            Save
        </button>
    </div>
</app-modal-layout>
