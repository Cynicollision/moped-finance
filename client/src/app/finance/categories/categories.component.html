<div class="categories-container">
    <div class="header-actions hide-on-mobile">
        <h1 class="desktop-page-title" style="margin: 0;">Categories</h1>
        <span class="spacer" style="flex: 1 1 auto;"></span>
        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="More options">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="startAddGroup()">
                <mat-icon>folder</mat-icon>
                <span>Create Group</span>
            </button>
            <button mat-menu-item (click)="startAddCategory()">
                <mat-icon>category</mat-icon>
                <span>Create Category</span>
            </button>
        </mat-menu>
    </div>

    <ng-container
    *ngTemplateOutlet="categorySection; context: { title: 'Income', groupedCategories: incomeGroups }"></ng-container>
    <ng-container
    *ngTemplateOutlet="categorySection; context: { title: 'Expenses', groupedCategories: expenseGroups }"></ng-container>

</div>

<ng-template #categorySection let-title="title" let-groupedCategories="groupedCategories">
    <div class="category-section-wrapper">
        <div class="section-header">
            <h2>{{title}}</h2>
        </div>

        <div class="group-list">
            @for (item of groupedCategories; track item) {
                <mat-card class="group-card">
                    <div class="group-header" style="gap: 16px;">
                        <h3>{{item.group.name}}</h3>
                        <button mat-button class="edit-btn" (click)="editGroup(item.group)">Edit</button>
                    </div>
                    <mat-card-content>
                        <div class="category-list">
                            @for (cat of item.categories; track cat) {
                                <div class="category-row" [class.inactive]="!cat.isActive">
                                    <div class="category-info">
                                        <span class="icon">{{cat.icon}}</span>
                                        <span class="name">{{cat.name}}</span>
                                    </div>
                                    <div class="category-actions">
                                        @if (!cat.isActive) {
                                            <mat-icon class="hidden-icon"
                                            matTooltip="Hidden Category">visibility_off</mat-icon>
                                        }
                                        <button mat-icon-button (click)="editCategory(cat)" matTooltip="Edit Category"
                                            class="edit-category-btn">
                                            <mat-icon>edit</mat-icon>
                                        </button>
                                    </div>
                                </div>
                            }
                        </div>
                        <div class="add-category-row">
                            <button mat-button (click)="startAddCategory(item.group.id)">Create Category</button>
                        </div>
                    </mat-card-content>
                </mat-card>
            }

            @if (groupedCategories.length === 0) {
                <div class="empty-state">
                    No {{title | lowercase}} groups found.
                </div>
            }
        </div>
    </div>
</ng-template>
