<ul class="password-rules" aria-label="Password rules">
    @for (check of checks(); track check.rule) {
        <li [class.met]="check.met">
            <mat-icon aria-hidden="true">{{ check.met ? 'check_circle' : 'radio_button_unchecked' }}</mat-icon>
            <span>{{ check.rule }}</span>
            <span class="visually-hidden">{{ check.met ? '(met)' : '(not met)' }}</span>
        </li>
    }
</ul>
