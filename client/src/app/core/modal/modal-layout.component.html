<h2 mat-dialog-title class="modal-header">
    <div class="header-content">
        <ng-container *ngIf="title">{{ title }}</ng-container>
        <ng-content select="[modal-title]"></ng-content>
    </div>
    <button mat-icon-button mat-dialog-close class="close-button" *ngIf="showClose" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
    </button>
</h2>

<mat-dialog-content class="modal-content">
    <ng-content></ng-content>
</mat-dialog-content>

<mat-dialog-actions class="modal-actions" [align]="alignActions">
    <ng-content select="[modal-actions]"></ng-content>
</mat-dialog-actions>
