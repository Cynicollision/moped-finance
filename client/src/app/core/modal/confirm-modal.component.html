<app-modal-layout [title]="data.title || 'Confirm Action'">
    <p class="confirm-message">{{ data.message }}</p>

    <div modal-actions>
        <button mat-button (click)="onCancel()">{{ data.cancelLabel || 'Cancel' }}</button>
        <button mat-flat-button [class.danger-button]="data.isWarn" (click)="onConfirm()">
            {{ data.confirmLabel || 'Confirm' }}
        </button>
    </div>
</app-modal-layout>
