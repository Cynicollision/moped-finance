@if (variant() === 'full') {
    <button type="button" class="profile-trigger" [matMenuTriggerFor]="profileMenu">
        <span class="avatar">{{ initials() }}</span>
        <span class="profile-name">{{ displayName() }}</span>
        <mat-icon class="profile-arrow">{{ above() ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
    </button>
}
@else {
    <button type="button" class="avatar-trigger" [matMenuTriggerFor]="profileMenu"
        [attr.aria-label]="'Profile menu for ' + displayName()">
        <span class="avatar">{{ initials() }}</span>
    </button>
}

<mat-menu #profileMenu="matMenu" xPosition="after" [yPosition]="above() ? 'above' : 'below'">
    <a mat-menu-item routerLink="/settings/institutions">
        <mat-icon>account_balance</mat-icon>
        <span>Institutions</span>
    </a>
    <a mat-menu-item routerLink="/settings/categories">
        <mat-icon>category</mat-icon>
        <span>Categories</span>
    </a>
    <a mat-menu-item routerLink="/settings">
        <mat-icon>settings</mat-icon>
        <span>Settings</span>
    </a>
    <mat-divider></mat-divider>
    <button mat-menu-item class="sign-out" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Sign out</span>
    </button>
</mat-menu>
