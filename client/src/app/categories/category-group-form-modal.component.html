<app-modal-layout [title]="isEditing ? 'Edit Group' : 'Create Group'">
    <form id="category-group-form" [formGroup]="form" (ngSubmit)="save()">
        <div class="form-row">
            <mat-form-field appearance="outline">
                <mat-label>Name</mat-label>
                <input matInput formControlName="name" placeholder="e.g. Auto & Transport" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Type</mat-label>
                <mat-select formControlName="type">
                    @for (opt of typeOptions; track opt) {
                        <mat-option [value]="opt">
                            {{ opt | titlecase }}
                        </mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </form>
    @if (isEditing && categoryCount > 0) {
        <p class="locked-note">
            To change the type or delete this group, first move or delete its {{ categoryCount }}
            {{ categoryCount === 1 ? 'category' : 'categories' }}.
        </p>
    }

    @if (isEditing) {
        <div modal-actions-start>
            <button mat-button class="danger-button" type="button" (click)="delete()" [disabled]="categoryCount > 0">
                Delete
            </button>
        </div>
    }
    <div modal-actions>
        <button mat-button type="button" appModalCancel>Cancel</button>
        <button mat-flat-button type="submit" form="category-group-form" [disabled]="form.invalid || isSaving()">
            @if (isSaving()) {
                <mat-progress-spinner class="button-spinner" mode="indeterminate" diameter="18"></mat-progress-spinner>
            }
            Save
        </button>
    </div>
</app-modal-layout>
