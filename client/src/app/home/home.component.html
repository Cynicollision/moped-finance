<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>Home</mat-card-title>
    </mat-card-header>
    <mat-card-content>
        @if (authService.currentUser()) {
        <p>Welcome to Home Lab, {{ authService.currentUser()?.displayName }}!</p>
        } @else {
        <p>Welcome to Home Lab! Please log in to continue.</p>
        <button mat-raised-button color="primary" routerLink="/login">Login</button>
        }
    </mat-card-content>
</mat-card>
