<app-page-header title="Change Password" [crumbs]="[{ label: 'Settings', link: '/settings' }]"></app-page-header>

<mat-card class="settings-section">
    <mat-card-content class="section-content">
        <form class="password-form" [formGroup]="form" (ngSubmit)="changePassword()">
            <!-- Lets password managers tie the new password to this account -->
            <input class="hidden-username" type="text" autocomplete="username" [value]="username()" readonly />

            <mat-form-field appearance="outline">
                <mat-label>Current Password</mat-label>
                <input matInput type="password" formControlName="currentPassword" autocomplete="current-password" />
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>New Password</mat-label>
                <input matInput type="password" formControlName="newPassword" autocomplete="new-password" />
            </mat-form-field>

            @if (passwordPolicy.error(); as error) {
                <app-load-error [message]="error" (retry)="passwordPolicy.reload()"></app-load-error>
            } @else if (passwordPolicy.value(); as policy) {
                <app-password-rules
                    [password]="newPassword()"
                    [username]="username()"
                    [minLength]="policy.minLength"
                ></app-password-rules>
            } @else {
                <div class="rules-placeholder" aria-busy="true" aria-label="Loading">
                    <app-skeleton width="50%" height="16px"></app-skeleton>
                    <app-skeleton width="60%" height="16px"></app-skeleton>
                </div>
            }

            <mat-form-field appearance="outline">
                <mat-label>Confirm New Password</mat-label>
                <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
            </mat-form-field>

            @if (mismatch()) {
                <p class="error-message">Passwords do not match.</p>
            }

            <div class="actions-row">
                <button mat-flat-button type="submit" [disabled]="!canSubmit()">
                    @if (saving()) {
                        <mat-progress-spinner
                            class="button-spinner"
                            mode="indeterminate"
                            diameter="18"
                        ></mat-progress-spinner>
                    }
                    Change Password
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
