<app-page-header title="Profile" [crumbs]="[{ label: 'Settings', link: '/settings' }]"></app-page-header>

<mat-card class="settings-section">
    <mat-card-content class="section-content">
        <form class="profile-form" [formGroup]="form" (ngSubmit)="save()">
            <mat-form-field appearance="outline">
                <mat-label>Username</mat-label>
                <input matInput [value]="user()?.username ?? ''" readonly />
                <mat-hint>The username can't be changed.</mat-hint>
            </mat-form-field>

            <mat-form-field appearance="outline">
                <mat-label>Display Name</mat-label>
                <input matInput formControlName="displayName" [maxlength]="maxLength" autocomplete="name" />
                @if (form.controls.displayName.hasError('required') || form.controls.displayName.hasError('pattern')) {
                    <mat-error>Display name is required</mat-error>
                }
                <mat-hint>Shown in the profile menu.</mat-hint>
            </mat-form-field>

            <div class="actions-row">
                <button mat-flat-button type="submit" [disabled]="form.invalid || form.pristine || saving()">
                    @if (saving()) {
                        <mat-progress-spinner
                            class="button-spinner"
                            mode="indeterminate"
                            diameter="18"
                        ></mat-progress-spinner>
                    }
                    Save
                </button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
