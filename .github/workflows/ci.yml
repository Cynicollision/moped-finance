name: CI

on:
  push:
    branches: [main]
    # A release tag also publishes the image under its version (the publish job)
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Prettier
        run: npm ci

      - name: Check formatting (run 'npm run format' in the repository root to fix)
        run: npm run format:check

  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Type-check server
        run: npx tsc --noEmit
        working-directory: server

      - name: Lint server and shared
        run: npm run lint
        working-directory: server

      - name: Check migrations match the Drizzle schema
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            git status --porcelain -- migrations
            echo "The Drizzle tables changed without a migration. Run 'npm run db:generate' in server/ and commit the result."
            exit 1
          fi
        working-directory: server

      - name: Run server tests
        run: npm test
        working-directory: server

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Lint client
        run: npx ng lint
        working-directory: client

      - name: Check emoji data matches emoji-picker-element-data
        run: |
          npm run emoji-data
          if [ -n "$(git status --porcelain -- public/emoji)" ]; then
            git status --porcelain -- public/emoji
            echo "The emoji data is out of date. Run 'npm run emoji-data' in client/ and commit the result."
            exit 1
          fi
        working-directory: client

      - name: Run client tests
        run: npx ng test --watch=false
        working-directory: client

      - name: Build client (production)
        run: npx ng build
        working-directory: client

  smoke:
    name: Production image smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: moped
          POSTGRES_PASSWORD: moped
          POSTGRES_DB: moped
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moped"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t moped-finance:ci .

      - name: Start container
        run: >-
          docker run -d --name app --network host
          -e PGHOST=127.0.0.1 -e PGUSER=moped -e PGPASSWORD=moped -e PGDATABASE=moped
          moped-finance:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 2
          done
          echo "/health did not return 200 within 60s"
          exit 1

      - name: Check migrations ran (registration is open on an empty database)
        run: curl -fsS http://127.0.0.1:3000/auth/registration | grep -q '"isOpen":true'

      - name: Check registration starts with the default categories (the image has default-data)
        run: |
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"smoke","name":"Smoke Test","password":"smoke test password","defaultCategories":true}' \
            http://127.0.0.1:3000/auth/register
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/v1/categories | grep -q '"name":"Groceries"'
          curl -fsS http://127.0.0.1:3000/auth/registration | grep -q '"isOpen":false'

      - name: Check the compiled reset-password command works (AUTH-12)
        run: |
          printf 'reset smoke password\nreset smoke password\n' | docker exec -i app npm run --silent reset-password
          # The reset signed out the session from registering, and the new password signs in
          test "$(curl -s -o /dev/null -w '%{http_code}' -b cookies.txt http://127.0.0.1:3000/api/v1/categories)" = 401
          curl -fsS -H 'Content-Type: application/json' \
            -d '{"username":"smoke","password":"reset smoke password"}' \
            http://127.0.0.1:3000/auth/login

      - name: Check wipe-database empties the instance (APP-10.1)
        run: |
          if echo nope | docker exec -i app npm run --silent wipe-database; then
            echo 'wipe-database went ahead without its confirmation'
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/auth/registration | grep -q '"isOpen":false'
          echo wipe | docker exec -i app npm run --silent wipe-database
          curl -fsS http://127.0.0.1:3000/auth/registration | grep -q '"isOpen":true'

      - name: Check load-sample-data fills an empty instance (APP-10.3)
        run: |
          docker exec app npm run --silent load-sample-data
          # Registering works straight after a wipe, without restarting the app
          curl -fsS -c cookies.txt -H 'Content-Type: application/json' \
            -d '{"username":"smoke","name":"Smoke Test","password":"smoke test password","defaultCategories":false}' \
            http://127.0.0.1:3000/auth/register
          curl -fsS -b cookies.txt http://127.0.0.1:3000/api/v1/accounts | grep -q '"name":"Everyday Checking"'
          if docker exec app npm run --silent load-sample-data; then
            echo 'load-sample-data loaded into an instance that already had data'
            exit 1
          fi

      - name: Check / serves index.html
        run: curl -fsS http://127.0.0.1:3000/ | grep -q '<app-root'

      - name: Check security headers are sent
        run: curl -fsSI http://127.0.0.1:3000/ | grep -qi '^content-security-policy:'

      - name: Container logs
        if: always()
        run: docker logs app

  publish:
    name: Publish image
    needs: [format, server, client, smoke]
    # Pushes to main and release tags only, never pull requests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main: latest and sha-<commit>. A release tag v1.2.3: 1.2.3, 1.2 and sha-<commit>.
      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/cynicollision/moped-finance
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
