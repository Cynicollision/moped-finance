version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: home_lab_db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-deps
    container_name: home_lab_api
    working_dir: /app/server
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      - NODE_ENV=development
      - PGHOST=postgres
      - PGUSER=${PGUSER}
      - PGPASSWORD=${PGPASSWORD}
      - PGDATABASE=${PGDATABASE}
      - PORT=3000
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules  # Prevents host node_modules from overriding container's
    command: npm run dev
    depends_on:
      - postgres

volumes:
  db_data: