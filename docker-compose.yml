name: moped-finance

services:

  postgres:
    image: postgres:16-alpine
    container_name: moped-finance-db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      TZ: ${TZ:-UTC}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: server-deps
    container_name: moped-finance-api
    working_dir: /app/server
    ports:
      - "3000:3000"
      - "9229:9229"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PGHOST=postgres
      - PORT=3000
      - TZ=${TZ:-UTC}
    volumes:
      - ./server:/app/server
      - ./shared:/app/shared
      - /app/server/node_modules  # Prevents host node_modules from overriding container's
    command: npm run dev
    depends_on:
      # The API migrates the database on startup, so it has to wait until Postgres accepts connections.
      postgres:
        condition: service_healthy

volumes:
  db_data:
