name: moped-finance

services:
  postgres:
    image: postgres:16-alpine
    container_name: moped-finance-db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    image: ${DOCKER_IMAGE:-moped-finance:latest}
    container_name: moped-finance-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PGHOST=postgres
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_data: