name: moped-finance

services:
  postgres:
    image: postgres:16-alpine
    container_name: moped-finance-db
    restart: always
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: ${PGDATABASE}
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    # The image CI publishes from main; set DOCKER_IMAGE for a release (ghcr.io/cynicollision/moped-finance:0.1) or a local build
    image: ${DOCKER_IMAGE:-ghcr.io/cynicollision/moped-finance:latest}
    container_name: moped-finance-api
    restart: always
    ports:
      # APP_PORT is the port on the host; the app listens on 3000 inside the container
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PGHOST=postgres
      - PORT=3000
      - TZ=${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget exits non-zero on the 503 that /health returns when the database is unreachable
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Room for in-flight requests to finish on docker stop; the server's own shutdown timeout is 25s.
    stop_grace_period: 30s

volumes:
  db_data:
